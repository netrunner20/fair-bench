  minimax-h3-max:
    adapter: fal
    endpoint: null
    endpoint_hint: "fal extend-video only (input 1.6-60 s)"
    cost_per_generation_usd: 0.40   # fal: $0.08/s, 5 s minimum
    arguments: {video_url: "{video_url}", prompt: "{prompt}"}   # VERIFY
    output_path: video.url

  wan-3.0:
