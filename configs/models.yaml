    endpoint_hint: "Alibaba (first-clip continuation mode); fal; Replicate; Atlas; Novita; WaveSpeed extend"
    cost_per_generation_usd: 0.60   # Alibaba: billed on total length incl. input
    arguments: {video_url: "{video_url}", prompt: "{prompt}", seed: "{seed}"}   # VERIFY
    output_path: video.url
  wan-2.6:
    adapter: http
    endpoint_hint: "WaveSpeed extend only [backend unclear]"
    cost_per_generation_usd: 0.50   # 5 s minimum
    submit: {url: null}
    poll: {url: null}
  wan-2.5:
