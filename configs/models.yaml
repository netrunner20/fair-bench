    cost_per_generation_usd: 0.14   # ~$0.036/s; +~$0.07 if the input context is billed
    arguments: {video_url: "{video_url}", prompt: "{prompt}", seed: "{seed}"}   # VERIFY
    output_path: video.url
    notes: open weights (22B)
  ltx-2.3-pro:
