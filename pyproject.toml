[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fair-bench"
version = "0.1.0"
description = "FAIR-Bench: testing whether video generation models understand physics through intervention robustness"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Hyundam Choi" }]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "opencv-python-headless>=4.8",
  "imageio>=2.31",
  "imageio-ffmpeg>=0.4.9",
  "pyyaml>=6.0",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "requests>=2.31",
]

[project.optional-dependencies]
pinn = ["torch>=2.1"]          # Morpheus-style PINN dynamical score
api = ["fal-client>=0.4", "replicate>=0.25"]
dev = ["pytest>=7"]
# SAM 2.1 tracker: pip install "git+https://github.com/facebookresearch/sam2.git" (+ a checkpoint)

[project.scripts]
fairbench = "fairbench.cli:main"

[tool.setuptools.packages.find]
include = ["fairbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
